name: Build and commit pdfs.json

on:
  push:
    paths:
      - 'documents/**'
      - 'pdfs/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'documents/**'
      - 'pdfs/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event.head_commit.author.email != 'github-actions@github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Run build script
        run: |
          node scripts/remove-deleted-pdf-metadata.mjs
          node scripts/generate-metadata.mjs
          node scripts/build-library.mjs

      - name: Commit and push pdfs.json if changed
        uses: EndBug/add-and-commit@v9
        with:
          message: 'ci: update pdfs.json'
          add: '--force --all documents pdfs.json'
          author_name: github-actions
          author_email: github-actions@github.com
          push: true
